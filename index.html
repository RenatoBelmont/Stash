<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stash</title>
    <meta name="description" content="Guarde links, vídeos, imagens e prints da internet. O Stash organiza tudo sozinho por categorias." />
    <meta name="theme-color" content="#fcfaf6" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stash" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Aplica o tema antes de desenhar a página (evita "piscar" no tema errado) -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('stash.v1')) || {};
          var t = (s.settings && s.settings.theme) || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- Ícones (Lucide, versão fixa, a mesma do Waypoint). Sem internet o app funciona, só sem os desenhos dos ícones. -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>

    <!-- Scripts clássicos: funciona abrindo o arquivo direto (file://) ou publicado no GitHub Pages -->
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/meta.js"></script>
    <script src="js/classify.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
